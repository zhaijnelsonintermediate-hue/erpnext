# ERPNext + Frappe CRM 一体化部署。
#
# 两个应用装在同一个 bench / 同一个站点里，因此共享用户、权限和数据库，
# CRM 的「成交 -> 报价/订单」可以直接落到 ERPNext，不需要跨系统同步。
#
# 镜像必须是 docker/build-image.sh 构建出来的自定义镜像：官方的
# frappe/erpnext 镜像里不含 crm 应用。
#
# 用法见仓库根目录 README.md，或直接 `make up`。

x-backend-defaults: &backend-defaults
  image: ${IMAGE:-erpnext-crm:local}
  networks:
    - frappe
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  # 把 db / redis 的地址写进 common_site_config.json，跑完即退出。
  configurator:
    image: ${IMAGE:-erpnext-crm:local}
    networks:
      - frappe
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      db:
        condition: service_healthy

  # 首次启动时建站并装上 erpnext + crm；站点已存在则直接跳过。
  create-site:
    image: ${IMAGE:-erpnext-crm:local}
    networks:
      - frappe
    restart: "no"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      SITE_NAME: ${SITE_NAME:-erp.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
    entrypoint: ["bash", "-c"]
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password="$$ADMIN_PASSWORD" --db-root-username=root --db-root-password="$$DB_PASSWORD" --install-app erpnext --install-app crm --set-default "$$SITE_NAME";
        fi;
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *backend-defaults

  websocket:
    <<: *backend-defaults
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  scheduler:
    <<: *backend-defaults
    command: ["bench", "schedule"]

  queue-long:
    <<: *backend-defaults
    command: ["bench", "worker", "--queue", "long,default,short"]

  queue-short:
    <<: *backend-defaults
    command: ["bench", "worker", "--queue", "short,default"]

  frontend:
    image: ${IMAGE:-erpnext-crm:local}
    networks:
      - frappe
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      # 单站点部署：固定把所有请求路由到该站点，不依赖 Host 头。
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-erp.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "${HTTP_PUBLISH_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

  db:
    image: mariadb:${MARIADB_VERSION:-11.8}
    networks:
      - frappe
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:${REDIS_VERSION:-6.2-alpine}
    networks:
      - frappe
    restart: unless-stopped

  redis-queue:
    image: redis:${REDIS_VERSION:-6.2-alpine}
    networks:
      - frappe
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe:
    driver: bridge
